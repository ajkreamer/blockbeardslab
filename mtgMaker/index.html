<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>MTG Maker</title>

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">

        <style>
            @font-face {
                font-family: 'Beleren';
                src: url('fonts/Beleren2016-Bold.ttf') format('truetype');
            }

            @font-face {
                font-family: 'BelerenCaps';
                src: url('fonts/Beleren2016SmallCaps-Bold.ttf') format('truetype');
            }

            @font-face {
                font-family: 'MPlantin';
                src: url('fonts/MPlantin.ttf') format('truetype');
            }

            @font-face {
                font-family: 'MPlantinItalic';
                src: url('fonts/MPlantinItalic.ttf') format('truetype');
            }

            #card {
                border: 0px;
                width: 1100px !important;
            }

            #card tr {
                border: 0px;
            }

            #cardControls {
                vertical-align: top;
                padding: 20px;
                padding-top: 0px;
                text-align: center;
            }

            #cardArt {
                height: 880px !important;
                padding: 0px !important;
                width: 630px !important;
            }

            #cardArtGradient {
                background-image: linear-gradient(to bottom, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.85));
                background-position: center;
                background-size: cover;
                height: 880px;
            }

            #cardArtManaCost {
                margin-right: 74px;
                margin-top: 74px;
            }

            #cardArtNameBorder {
                background-image: url('img/cardArtNameBorder.png');
                background-position: top;
                background-repeat: no-repeat;
                background-size: cover;
                height: 132px;
            }

            #cardArtNameContainer {
                height: 132px;
            }

            #cardArtNameOverlay {
                background-image: url('img/cardArtNameOverlay.png');
                background-position: top;
                background-repeat: no-repeat;
                background-size: cover;
                height: 132px;
            }

            #cardArtNamePlate {
                height: 132px;
                position: relative;
            }

            #cardArtName {
                color: white;
                display: inline-block;
                font-family: 'Beleren';
                font-size: 31px;
                height: 132px;
                margin: 0px;
                padding: 0px;
                transform: translateX(75px) translateY(68px);
                text-shadow: 2px 2px 1px black;
            }

            #cardCredits {
                color: white;
                font-family: 'BelerenCaps';
                font-size: 13px;
                padding-bottom: 35px;
                padding-left: 60px;
            }

            .mana-cost {
                background-color: #000;
                border-radius: 50%;
                display: inline-block;
                height: 31px !important;
                margin-left: 2px;
                width: 28px !important;
            }

            .mana-cost-symbol {
                width: 28px !important;
                height: 28px !important;
            }
        </style>

        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.0/jquery.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
        <script src="js/html2canvas.min.js"></script>
    </head>

    <body class="blue-grey lighten-4" style="padding-top: 15px;">
        <table id="card">
            <tr>
                <td id="cardControls">
                    <div class="input-field">
                        <input type="file" id="backgroundImageInput" accept="image/*" style="display: none;">
                        <button class="btn left" onclick="document.getElementById('backgroundImageInput').click()">
                            Art
                        </button>

                        <button class="btn right" id="downloadButton">
                            Download
                        </button>
                    </div>

                    <div class="white" style="padding: 25px;">
                        <h4>Settings</h4>
                        
                        <div class="row">
                            <div class="input-field col s2">
                                <input id="cardNameFontSize" type="number" value="31">
                                <label for="cardNameFontSize">Size</label>
                            </div>

                            <div class="input-field col s10">
                                <input id="cardName" type="text">
                                <label for="cardName">Card Name</label>
                            </div>

                            <div class="input-field col s12">
                                <input id="cardCost" type="text">
                                <label for="cardCost">Cost</label>
                            </div>
                        </div>

                        <div class="row">
                            <div class="input-field col s2">
                                <input id="cardCreditsFontSize" type="number" value="13" min="8" max="72">
                                <label for="cardCreditsFontSize">Size</label>
                            </div>

                            <div class="input-field col s10">
                                <input id="cardArtist" type="text">
                                <label for="cardArtist">Card Artist</label>
                            </div>
                        </div>

                        <div class="row">
                            <div class="input-field col s6">
                                <select id="cardArtBackgroundPosition">
                                    <option value="top left">       Top Left</option>
                                    <option value="top">            Top</option>
                                    <option value="top right">      Top Right</option>
                                    <option value="left">           Left</option>
                                    <option value="center" selected>Center</option>
                                    <option value="right">          Right</option>
                                    <option value="bottom left">    Bottom Left</option>
                                    <option value="bottom">         Bottom</option>
                                    <option value="bottom right">   Bottom Right</option>
                                </select>
                                <label>Art Position</label>
                            </div>

                            <div class="input-field col s3">
                                <input id="cardArtBackgroundX" type="number" value="0">
                                <label for="cardArtBackgroundX">X Offset</label>
                            </div>

                            <div class="input-field col s3">
                                <input id="cardArtBackgroundY" type="number" value="0">
                                <label for="cardArtBackgroundY">Y Offset</label>
                            </div>
                        </div>
                    </div>
                </td>

                <td id="cardArt" class="white z-depth-1">
                    <div id="cardArtGradient">
                        <div id="cardArtNameContainer">
                            <div id="cardArtNameBorder">
                                <div id="cardArtNamePlate" style="background-image: url('img/cardArtNamePlate.png');">
                                    <div id="cardArtNameOverlay">
                                        <span id="cardArtName">Name</span>
                                        <span id="cardArtManaCost" class="right"></span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div id="cardArtTextContainer" style="padding: 0px; margin: 0px; height: 748px; display: flex; align-items: flex-end;">
                            <div id="cardCredits">
                                Art by <span id="cardArtArtist"></span>
                                <br>Proxy by Blockbeard
                            </div>
                        </div>
                    </div>
                </td>
            </tr>
        </table>
    </body>
</html>

<script>
    $(function () {
        $('select').formSelect();

        const artBackgroundState = {
            position: 'center',
            x: 0,
            y: 0
        };

        function updateArtBackgroundPosition() {
            const positionMap = {
                left: ['0%', '50%'],
                center: ['50%', '50%'],
                right: ['100%', '50%'],
                top: ['50%', '0%'],
                bottom: ['50%', '100%'],
                'top left': ['0%', '0%'],
                'top right': ['100%', '0%'],
                'bottom left': ['0%', '100%'],
                'bottom right': ['100%', '100%']
            };

            const [xBase, yBase] = positionMap[artBackgroundState.position] || positionMap.center;

            $('#cardArt').css({
                'background-position-x': `calc(${xBase} + ${artBackgroundState.x}px)`,
                'background-position-y': `calc(${yBase} + ${artBackgroundState.y}px)`
            });
        }

        // Keep the card preview name in sync with the input
        $('#cardName').on('input', function() {
            $('#cardArtName').text($(this).val());
        });

        // Keep the mana cost preview in sync with the input
        $('#cardCost').on('input', function() {
            var manaCost = $('#cardCost').val().split(',');

            var manaCostHtml = '';
            for (var i = 0; i < manaCost.length; i++) {
                if (manaCost[i].length) manaCostHtml += `<span class="mana-cost"><img class="mana-cost-symbol" src="img/cost/` + manaCost[i] + `.png"></span>`;
            }

            $('#cardArtManaCost').html(manaCostHtml);
        }).trigger('input');

        // Keep the card preview name size in sync with the font size input
        $('#cardNameFontSize').on('input', function() {
            $('#cardArtName').css('font-size', `${$(this).val()}px`);
        }).trigger('input');

        // Keep the card credits size in sync with the font size input
        $('#cardCreditsFontSize').on('input', function() {
            $('#cardCredits').css('font-size', `${$(this).val()}px`);
        }).trigger('input');

        // Keep the card artist preview in sync with the input
        $('#cardArtist').on('input', function() {
            $('#cardArtArtist').text($(this).val());
        }).trigger('input');

        // Keep the card art background position in sync with the select
        $('#cardArtBackgroundPosition').on('change', function() {
            artBackgroundState.position = $(this).val();
            updateArtBackgroundPosition();
        });

        $('#cardArtBackgroundX').on('input', function() {
            artBackgroundState.x = Number($(this).val()) || 0;
            updateArtBackgroundPosition();
        });

        $('#cardArtBackgroundY').on('input', function() {
            artBackgroundState.y = Number($(this).val()) || 0;
            updateArtBackgroundPosition();
        });

        // Handle background image file selection
        $('#backgroundImageInput').on('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const imageUrl = event.target.result;
                    $('#cardArt').css({
                        'background-image': `url(${imageUrl})`,
                        'background-size': 'cover',
                        'background-repeat': 'no-repeat'
                    });
                    updateArtBackgroundPosition();
                };
                reader.readAsDataURL(file);
            }
        });

        // Handle card download
        $('#downloadButton').on('click', function() {
            const cardArt = document.getElementById('cardArt');
            html2canvas(cardArt, {
                backgroundColor: null,
                scale: 2,
                useCORS: true
            }).then(function(canvas) {
                const cardName = $('#cardName').val() || 'mtg-card';
                const safeFileName = cardName.replace(/[^a-z0-9]/gi, '_').toLowerCase() + '.png';
                const link = document.createElement('a');
                link.download = safeFileName;
                link.href = canvas.toDataURL();
                link.click();
            }).catch(function(error) {
                console.error('Error capturing card:', error);
                alert('Error capturing card. Please try again.');
            });
        });
    });
</script>
