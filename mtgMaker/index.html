            }

            #cardArtNameBorder {
                background-image: url('img/cardArtNameBorder.png');
                background-position: top;
                background-repeat: no-repeat;
                background-size: cover;
                height: 132px;
            }

            #cardArtNameBorder.color-tinted {
                background-color: var(--name-border-color, #8e8451);
                background-image: none;
                -webkit-mask-image: url('img/cardArtNameBorder.png');
                mask-image: url('img/cardArtNameBorder.png');
                -webkit-mask-position: top;
                mask-position: top;
                -webkit-mask-repeat: no-repeat;
                mask-repeat: no-repeat;
                -webkit-mask-size: cover;
                mask-size: cover;
            }

            #cardArtNameContainer {
                height: 132px;
            }

            #cardArtNameOverlay {
                background-image: url('img/cardArtNameOverlay.png');
                background-position: top;
                background-repeat: no-repeat;
                background-size: cover;
                height: 132px;
            }

            #cardArtNamePlate {
                --name-plate-bg-opacity: 0.8;
                height: 132px;
                position: relative;
            }

            #cardArtNamePlate::before {
                background-image: url('img/cardArtNamePlate.png');
                background-position: top;
                background-repeat: no-repeat;
                background-size: cover;
                content: '';
                inset: 0;
                opacity: var(--name-plate-bg-opacity);
                pointer-events: none;
                position: absolute;
                z-index: 0;
            }

            #cardArtNamePlate.color-tinted::before {
                background-color: var(--name-plate-color, #8e8451);
                background-image: none;
                -webkit-mask-image: url('img/cardArtNamePlate.png');
                mask-image: url('img/cardArtNamePlate.png');
                -webkit-mask-position: top;
                mask-position: top;
                -webkit-mask-repeat: no-repeat;
                mask-repeat: no-repeat;
                -webkit-mask-size: cover;
                mask-size: cover;
            }

            #cardArtNamePlate > * {
                position: relative;
                z-index: 1;
            }

            #cardArtName {
                color: white;
                display: inline-block;
                font-family: 'Beleren';
                font-size: 31px;
                height: 132px;
                margin: 0px;
                padding: 0px;
                transform: translateX(75px) translateY(68px);
                text-shadow: 2px 2px 1px black;
            }

            #cardTextContainer {
                display: flex;
                flex-direction: column;
                justify-content: flex-end;
            }

            .color {
                cursor: pointer;
                display: inline-block;
                height: 25px;
                margin: 5px;
                width: 25px;
            }

            .color.gold {
                background-color: #8e8451;
            }
        </style>

<script>
    $(function () {
        // Initialize collapsibles
        $('.collapsible').collapsible();
        $('.tooltipped').tooltip();

        // Keep the card preview name in sync with the input
        $('#cardName').on('input', function() {
            $('#cardArtName').text($(this).val());
        });

        // Keep the card preview name size in sync with the font size input
        $('#cardNameFontSize').on('input', function() {
            $('#cardArtName').css('font-size', `${$(this).val()}px`);
        }).trigger('input');

        // Recolor the non-transparent parts of the name border/plate images when a color swatch is clicked
        $('.color').on('click', function() {
            const swatchColor = $(this).css('background-color');
            $('#cardArtNameBorder').addClass('color-tinted').css('--name-border-color', swatchColor);
            $('#cardArtNamePlate').addClass('color-tinted').css('--name-plate-color', swatchColor);
        });

        // Control name plate background opacity
        $('#cardNamePlateOpacity').on('input', function() {
            const opacityPercent = `${$(this).val()}%`;
            const opacity = Number($(this).val()) / 100;
            $(this).attr('data-tooltip', opacityPercent);
            $(this).attr('title', opacityPercent);

            const tooltipInstance = M.Tooltip.getInstance(this);
            if (tooltipInstance && tooltipInstance.tooltipEl) {
                const tooltipContent = tooltipInstance.tooltipEl.querySelector('.tooltip-content');
                if (tooltipContent) {
                    tooltipContent.textContent = opacityPercent;
                }
            }

            $('#cardArtNamePlate').css('--name-plate-bg-opacity', opacity);
        }).trigger('input');
        
        // Handle background image file selection
        $('#backgroundImageInput').on('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const imageUrl = event.target.result;
                    $('#cardArt').css({
                        'background-image': `url(${imageUrl})`,
                        'background-size': 'cover',
                        'background-position': 'center',
                        'background-repeat': 'no-repeat'
                    });
                };
                reader.readAsDataURL(file);
            }
        });

        // Handle card download
        $('#downloadButton').on('click', function() {
            const cardArt = document.getElementById('cardArt');
            html2canvas(cardArt, {
                backgroundColor: null,
                scale: 2,
                useCORS: true
            }).then(function(canvas) {
                const cardName = $('#cardName').val() || 'mtg-card';
                const safeFileName = cardName.replace(/[^a-z0-9]/gi, '_').toLowerCase() + '.png';
                const link = document.createElement('a');
                link.download = safeFileName;
                link.href = canvas.toDataURL();
                link.click();
            }).catch(function(error) {
                console.error('Error capturing card:', error);
                alert('Error capturing card. Please try again.');
            });
        });
    });
</script>
